name: Trigger auto deployment for chirpstack-poc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ test ]
    paths:
    - '**'
    - '.github/workflows/chirpstack-poc-AutoDeployTrigger-5cfcac95-4d05-4e2c-8562-d748a27cb651.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CHIRPSTACKPOC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHIRPSTACKPOC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHIRPSTACKPOC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: chirpstackpocregistry.azurecr.io
          registryUsername: ${{ secrets.CHIRPSTACKPOC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHIRPSTACKPOC_REGISTRY_PASSWORD }}
          containerAppName: chirpstack-poc
          resourceGroup: lora-portal-chirpstack
          imageToBuild: chirpstackpocregistry.azurecr.io/chirpstack-poc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


